<form id="userForm">
   <label>AnvändarID</label><br>
   <input type="number" name="uid"><br>


   <label>Namn</label><br>
   <input type="text" name="name"><br>


   <label>mail</label><br>
   <input type="email" name="email"><br>

   <input type="submit" value="Uppdatera">
</form>

<output id="data"></output>

<script>
   const userForm = document.getElementById('userForm')
   userForm.addEventListener('submit', updateUser)


   async function updateUser(e) {
      e.preventDefault() // Stoppar formuläret från att ladda om sidan.

      const formData = new FormData(userForm)
      const data = new URLSearchParams(formData);


      const response = await fetch('http://localhost:5000/api/users', {
         method: "PUT",
         body: data
      })
      const result = await response.json()


      console.log("result: " + result.success)


      if (result.success)
         getUsers()
   }

   async function getUsers() {
      const response = await fetch('http://localhost:5000/api/users')
      const users = await response.json()
      document.getElementById('data').innerText = JSON.stringify(users)
   }


</script>
