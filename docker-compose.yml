volumes:
  mariadb_data:

services:

  web:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - 80:80
    environment:
      - TZ=Europe/Stockholm
    volumes: 
      - ./www/html:/var/www/html
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server
      - client

  server:
    build: 
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: server
    working_dir: /usr/src/server
    volumes:
      - ./www/server:/usr/src/server
    command: python server.py
    environment:
      - TZ=Europe/Stockholm
      - FLASK_APP=server.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
  
  client:
    image: node:latest
    container_name: client
    working_dir: /www/client
    command: "npm run dev -- --host 0.0.0.0"
    volumes:
      - ./www/client:/www/client
    environment:
      - TZ=Europe/Stockholm


  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/my.cnf
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=db
      - MYSQL_USER=pma
      - MYSQL_PASSWORD=12345
      - TZ=Europe/Stockholm

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma
    restart: always
    environment:
      - PMA_HOST=mariadb
      - TZ=Europe/Stockholm
    ports:
      - "8080:80"
    depends_on:
      - mariadb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    volumes:
      - ./mongodb:/data/db
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=12345
      - TZ=Europe/Stockholm